name: Build AWCC

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            libsystemd-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            wayland-protocols \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-svg-dev

      - name: Configure
        run: |
          cmake \
            -B build \
            -G Ninja

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awcc-build
          path: build/
